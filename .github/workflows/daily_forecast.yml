name: Daily Weather Forecast

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST (1:30 AM UTC)
  workflow_dispatch:        # Allow manual trigger for testing

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run forecast and notify
        env:
          GITHUB_TOKEN: ${{ secrets.WEATHER_GITHUB_TOKEN }}
          GITHUB_USER: ${{ secrets.WEATHER_GITHUB_USER }}
          GITHUB_REPO: ${{ secrets.WEATHER_GITHUB_REPO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATION_NAME: ${{ secrets.STATION_NAME }}
        run: python daily_forecast.py

      - name: Save trained model
        uses: actions/upload-artifact@v3
        with:
          name: rain-model
          path: rain_model.pkl
